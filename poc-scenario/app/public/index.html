<!DOCTYPE html>
<html>
<head>
  <title>Scenario POC</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    button {
      padding: 10px;
    }

    /* Layout naast elkaar */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    .auto-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      background-color: #ccc;
      border-radius: 24px;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: 0.4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }
  </style>
</head>

<body>

<h1 id="title"></h1>

<ul id="actions"></ul>

<div class="controls">

  <button onclick="manual()">Manueel</button>

  <div class="auto-control">
    <label class="switch">
      <input type="checkbox" id="autoToggle" onchange="toggle()">
      <span class="slider"></span>
    </label>
    <span id="statusText">Uit</span>
  </div>

</div>

<h2>Logs</h2>
<ul id="logs"></ul>

<script>

async function loadScenario() {
  const res = await fetch('/scenario');
  const data = await res.json();

  document.getElementById('title').textContent = data.name;

  const ul = document.getElementById('actions');
  ul.innerHTML = '';

  data.actions.forEach(a => {
    const li = document.createElement('li');
    li.textContent = a;
    ul.appendChild(li);
  });
}

// Manueel scenario 
async function manual() {
  await fetch('/trigger', { method: 'POST' });
  loadLogs();
}

// Toggle automatisering
async function toggle() {
  const r = await fetch('/automation/toggle', { method: 'POST' });
  const d = await r.json();

  document.getElementById('statusText').textContent =
    d.enabled ? "Aan" : "Uit";
}

async function loadStatus() {
  const r = await fetch('/automation/status');
  const d = await r.json();

  document.getElementById('autoToggle').checked = d.enabled;
  document.getElementById('statusText').textContent =
    d.enabled ? "Aan" : "Uit";
}

async function loadLogs() {
  try {
    const r = await fetch('/logs');
    const data = await r.json();

    const ul = document.getElementById('logs');
    ul.innerHTML = '';

    data.forEach(l => {
      const li = document.createElement('li');
      li.textContent = `${l.time} - ${l.trigger} - ${l.action}`;
      ul.appendChild(li);
    });
  } catch (e) {
    console.log("Logs error");
  }
}

setInterval(() => {
  loadLogs().catch(() => {});
}, 3000);

loadScenario();
loadLogs();
loadStatus();

</script>

</body>
</html>
