<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Login - Hub</title>
</head>
<body>
  <h1>Login</h1>

  {% if fout %}
    <p style="color:red">{{ fout }}</p>
  {% endif %}

  <form action="{{ url_for('login_submit') }}" method="post">
    <label>Gebruikersnaam: <input type="text" name="gebruikersnaam"></label><br>
    <label>Wachtwoord: <input type="password" name="wachtwoord"></label><br>
    <button type="submit">Login</button>
  </form>

  <hr>

  <p>Authenticatie plugin staat nu: <strong>{{ 'AAN' if plugin_actief else 'UIT' }}</strong></p>

  <form action="{{ url_for('toggle_plugin') }}" method="get">
    <button type="submit">
      {{ 'Plugin uitschakelen' if plugin_actief else 'Plugin inschakelen' }}
    </button>
  </form>

</body>
</html>
