version: "3.9"

services:
  hub:
    image: poc-hub:1.0
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - smarthome

  app:
    image: poc-app:1.0
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - smarthome

networks:
  smarthome:
    driver: overlay
