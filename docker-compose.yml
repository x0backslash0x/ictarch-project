services:

  hub:
    build: ./hub
    ports:
      - "5000:5000"
    volumes:
      # SCENARIO A: mount de plugins-map (auth vereist)
      - ./hub/plugins:/hub/plugins
      # SCENARIO B: commentarieer bovenstaande regel uit voor open modus
    networks:
      - smarthome-net

  app:
    build: ./app
    environment:
      - HUB_URL=http://hub:5000
    depends_on:
      - hub
    networks:
      - smarthome-net

networks:
  smarthome-net:
    driver: bridge